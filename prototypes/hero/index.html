<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Prototype · Hero · Le Calbar</title>
<style>
/* Site tokens (copied from site/style.css so the prototype stays isolated from production CSS) */
:root{--bg:#10100e;--ink:#f2eee5;--gold:#c6a568;--gold-hi:#d6b97f;--muted:#aaa69d;--line:#383226;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.65}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;line-height:1.04;margin:0}
h1 i{color:var(--gold);font-weight:400}

/* Context: the site header, so each hero is judged under the real top bar */
.ctx-header{position:relative;z-index:5;height:80px;display:flex;align-items:center;gap:30px;padding:0 6%;background:#0e0e0e;border-bottom:1px solid var(--line)}
.ctx-header img{width:115px;height:auto;display:block}
.ctx-nav{display:flex;gap:30px;border-left:1px solid #c6a15b66;padding-left:28px;font-family:Georgia,serif}
.ctx-nav a{min-height:48px;display:flex;align-items:center}
.ctx-burger{display:none;margin-left:auto;width:48px;height:48px;align-items:center;justify-content:center;color:var(--ink)}
.ctx-burger svg{width:28px;height:28px;stroke:currentColor;stroke-width:2;fill:none}
/* Context: the band and section that follow the hero */
.ctx-after{border-top:1px solid var(--line)}
.ctx-statement{padding:24px;text-align:center;border-bottom:1px solid var(--line);font-family:Georgia,serif;color:var(--gold);font-size:18px;letter-spacing:3px}
.ctx-next{padding:100px 8%;max-width:1440px;margin:0 auto}
.ctx-next h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(38px,4.3vw,62px);line-height:1.08;margin:0 0 24px}
.ctx-next h2 i{color:var(--gold)}
.ctx-next p{max-width:520px;color:#d3cec3}
@media(max-width:800px){
.ctx-header{height:72px;padding:0 5%}
.ctx-header img{width:84px}
.ctx-nav{display:none}
.ctx-burger{display:flex}
.ctx-statement{font-size:14px}
.ctx-next{padding:65px 7%}
}

/* Shared entrance: rise + fade, staggered by --i. Marketing moment, seen once per visit. */
.pv-in{animation:pv-rise 600ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 70ms + 80ms)}
@keyframes pv-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pv-in{animation:pv-fade 300ms ease both;animation-delay:0ms}}
@keyframes pv-fade{from{opacity:0}to{opacity:1}}

/* Shared video layer */
.pv-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}

/* Shared buttons */
.pv-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;font-size:15px;letter-spacing:.3px;border:1px solid var(--gold);transition:background-color 200ms ease,color 200ms ease,border-color 200ms ease,transform 160ms ease-out}
.pv-btn--primary{background:var(--gold);color:var(--bg)}
.pv-btn--ghost{color:var(--ink);background:rgba(14,14,14,.45)}
.pv-btn:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.pv-btn--primary:hover{background:var(--gold-hi);border-color:var(--gold-hi)}.pv-btn--ghost:hover{background:var(--gold);color:var(--bg)}}

/* ───────── 1 · Immersion — one focal action over full-bleed footage ───────── */
.v1{position:relative;isolation:isolate;min-height:calc(100svh - 80px);display:flex;flex-direction:column;overflow:hidden}
.v1::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 70% 60% at 50% 48%,rgba(0,0,0,.72),rgba(0,0,0,.35) 70%),linear-gradient(0deg,rgba(0,0,0,.75),transparent 35%)}
.v1 .pv-video{z-index:-2}
.v1-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 7% 40px}
.v1-kicker{margin:0 0 22px;color:#dfc18a;font-size:12px;letter-spacing:3px;text-transform:uppercase}
.v1 h1{font-size:clamp(46px,6.4vw,96px);letter-spacing:-.02em}
.v1-sig{margin:22px 0 38px;color:#e4dfd5;font-family:Georgia,serif;font-size:19px}
.v1-actions{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center}
.v1-link{display:inline-flex;gap:8px;padding:10px 0;color:var(--ink);border-bottom:1px solid rgba(242,238,229,.45);transition:border-color 200ms ease,color 200ms ease}
@media(hover:hover) and (pointer:fine){.v1-link:hover{color:var(--gold);border-color:var(--gold)}}
.v1-strip{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(198,165,104,.35);background:rgba(10,10,9,.55)}
.v1-strip>*{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:12px 16px;font-size:14px;color:#d3cec3;text-align:center}
.v1-strip>*+*{border-left:1px solid rgba(198,165,104,.25)}
.v1-strip a{color:var(--ink)}
.v1-strip a span{color:var(--gold)}
@media(max-width:800px){
.v1{min-height:calc(100svh - 72px)}
.v1-center{padding:48px 7% 32px}
.v1-sig{font-size:16px;margin:16px 0 28px}
.v1-actions{flex-direction:column;gap:14px;width:100%}
.v1-actions .pv-btn{width:100%}
.v1-strip{grid-template-columns:1fr 1fr}
.v1-strip>*{min-height:56px;padding:10px 8px;font-size:13px;white-space:nowrap}
.v1-city{display:none}
.v1-strip>:last-child{grid-column:1/-1;border-left:0;border-top:1px solid rgba(198,165,104,.25)}
}

/* ───────── 2 · Éditorial — split page, type leads, footage framed as an object ───────── */
.v2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:calc(100svh - 80px);max-height:960px}
.v2-copy{display:flex;flex-direction:column;justify-content:center;padding:64px 6% 56px 8%}
.v2 h1{font-size:clamp(48px,5.4vw,88px);letter-spacing:-.025em;line-height:.98}
.v2 h1 i{display:block}
.v2-sig{margin:28px 0 44px;max-width:420px;color:#c3bfb6;font-family:Georgia,serif;font-size:19px;line-height:1.5}
.v2-list{list-style:none;margin:0;padding:0;border-top:1px solid #5a4a2c;max-width:620px}
.v2-list a{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 24px;padding:20px 0;border-bottom:1px solid #5a4a2c;transition:padding-left 0ms}
.v2-list b{font-family:Georgia,serif;font-weight:400;font-size:clamp(22px,2vw,28px);line-height:1.2;transition:color 200ms ease}
.v2-list small{grid-column:1;color:var(--muted);font-size:14px}
.v2-list .arrow{grid-row:1/span 2;grid-column:2;color:var(--gold);font-size:26px;transition:transform 200ms var(--ease-out)}
.v2-list li:first-child b{color:var(--gold)}
.v2-list a:active{transform:scale(.99)}
@media(hover:hover) and (pointer:fine){.v2-list a:hover b{color:var(--gold)}.v2-list a:hover .arrow{transform:translateX(6px)}}
.v2-media{position:relative;margin:32px 32px 32px 0;overflow:hidden;background:#050504}
.v2-media figcaption{position:absolute;left:24px;bottom:20px;color:#e4dfd5;font-size:13px;letter-spacing:1px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
@media(max-width:800px){
.v2{grid-template-columns:1fr;min-height:0;max-height:none}
.v2-media{order:-1;margin:0;height:46svh;min-height:300px}
.v2-copy{padding:36px 7% 48px}
.v2 h1{font-size:clamp(36px,10.5vw,48px)}
.v2-sig{font-size:17px;margin:20px 0 30px}
.v2-list a{padding:16px 0}
}

/* ───────── 3 · Ce soir — practical: live opening status beside the promise ───────── */
.v3{position:relative;isolation:isolate;min-height:calc(100svh - 80px);max-height:900px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,420px);align-items:end;gap:48px;padding:72px 8% 64px;overflow:hidden}
.v3::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.35) 70%),linear-gradient(0deg,rgba(0,0,0,.6),transparent 45%)}
.v3 .pv-video{z-index:-2}
.v3 h1{font-size:clamp(44px,5vw,78px);letter-spacing:-.02em}
.v3-sig{margin:20px 0 0;color:#e4dfd5;font-family:Georgia,serif;font-size:19px}
.v3-card{background:#0e0e0e;border-top:2px solid var(--gold);padding:28px 28px 24px}
.v3-status{display:flex;align-items:center;gap:12px;margin:0;font-family:Georgia,serif;font-size:24px;line-height:1.25}
.v3-dot{flex:none;width:10px;height:10px;border-radius:50%;background:#7fb069;box-shadow:0 0 0 4px rgba(127,176,105,.18)}
.v3-card[data-open=false] .v3-dot{background:var(--muted);box-shadow:0 0 0 4px rgba(170,166,157,.15)}
.v3-hours{margin:8px 0 0 22px;color:var(--muted);font-size:14px}
.v3-where{display:flex;justify-content:space-between;gap:16px;margin:22px 0 24px;padding:14px 0;border-block:1px solid var(--line);font-size:14px;color:#d3cec3}
.v3-where a{color:var(--gold);white-space:nowrap}
.v3-actions{display:grid;grid-template-columns:1fr auto;gap:10px}
.v3-actions .pv-btn{padding:0 20px}
.v3-more{display:flex;gap:22px;margin:18px 0 0;font-size:14px}
.v3-more a{color:#d3cec3;border-bottom:1px solid var(--line);padding:6px 0}
@media(hover:hover) and (pointer:fine){.v3-more a:hover,.v3-where a:hover{color:var(--ink)}}
@media(max-width:800px){
.v3{grid-template-columns:1fr;align-items:end;gap:24px;padding:40px 5% 24px;min-height:calc(100svh - 72px);max-height:none}
.v3 h1{font-size:clamp(36px,10vw,46px)}
.v3-sig{font-size:15px;margin-top:12px}
.v3-card{padding:20px 18px 18px}
.v3-status{font-size:20px}
.v3-where{margin:16px 0 18px}
}

/* ───────── Picker (verbatim from PICKER.md) ───────── */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
</style></head>
<body>
<div class="ctx-header"><a href="../../index.html" aria-label="Le Calbar accueil"><img src="../../assets/calbar-logo.svg" alt="Le Calbar" width="140" height="79"></a><nav class="ctx-nav" aria-label="Navigation principale"><a href="../../index.html#paris">Le bar</a><a href="../../index.html#savoir-faire">Savoir-faire</a><a href="../../index.html#evenements">L’Évent</a><a href="../../agency.html">Agency</a></nav><a class="ctx-burger" href="../../index.html" aria-label="Retour au site"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 8h22M3 14h22M3 20h22"/></svg></a></div>
<main id="stage"></main>
<div class="ctx-after"><div class="ctx-statement">EXIGEZ L’EXCELLENCE, VIVEZ L’EXCEPTION.</div><section class="ctx-next"><h2>À deux pas<br><i>de la Gare de Lyon.</i></h2><p>Une ambiance intimiste, des cocktails sur mesure selon vos envies et vos inspirations du moment.</p></section></div>

<nav class="proto-picker" aria-label="Prototype variants" data-position="top">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Immersion</button>
  <button class="proto-picker-item">Éditorial</button>
  <button class="proto-picker-item">Ce soir</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const SITE='../../';
const VIDEO=`<video class="pv-video" autoplay muted loop playsinline preload="auto" poster="${SITE}assets/hero-video-poster.jpg" aria-label="Ambiance et préparation des cocktails au Calbar"><source src="${SITE}assets/hero-background.mp4" type="video/mp4"></video>`;
const H1='L’art du cocktail.<br><i>L’émotion en plus.</i>';

// Live opening status, from the bar's hours: Tuesday–Saturday 18:00–01:30, Paris time.
function openingStatus(){
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).map(p=>[p.type,p.value]));
  const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.weekday),mins=(+parts.hour%24)*60+(+parts.minute);
  const evening=d=>d>=2&&d<=6;            // Tue..Sat open in the evening
  if(evening(day)&&mins>=18*60)return{open:true,text:'Ouvert ce soir',hours:'Jusqu’à 1h30'};
  if(evening((day+6)%7)&&mins<90)return{open:true,text:'Encore ouvert',hours:'Jusqu’à 1h30'};
  if(evening(day))return{open:false,text:'Ouvre ce soir à 18h',hours:'Du mardi au samedi, 18h à 1h30'};
  return{open:false,text:'Fermé aujourd’hui',hours:'Réouverture mardi à 18h'};
}

const variants=[
  // 1 · Immersion
  ()=>`<section class="v1" aria-label="Accueil">${VIDEO}
    <div class="v1-center">
      <p class="v1-kicker pv-in" style="--i:0">Bar à cocktails · Paris 12e</p>
      <h1 class="pv-in" style="--i:1">${H1}</h1>
      <p class="v1-sig pv-in" style="--i:2">Le geste juste, le goût de l’exception.</p>
      <div class="v1-actions pv-in" style="--i:3"><a class="pv-btn pv-btn--primary" href="${SITE}index.html#contact">Réserver une table</a><a class="v1-link" href="${SITE}index.html#menus">Voir la carte <span aria-hidden="true">→</span></a></div>
    </div>
    <div class="v1-strip pv-in" style="--i:4"><p>Mardi–samedi · 18h–1h30</p><p>82 rue de Charenton<span class="v1-city">, Paris 12e</span></p><a href="${SITE}index.html#ateliers">Ateliers cocktails <span aria-hidden="true">→</span></a></div>
  </section>`,
  // 2 · Éditorial
  ()=>`<section class="v2" aria-label="Accueil">
    <div class="v2-copy">
      <h1 class="pv-in" style="--i:0">${H1}</h1>
      <p class="v2-sig pv-in" style="--i:1">Le geste juste, le goût de l’exception. Un bar à cocktails à deux pas de la Gare de Lyon.</p>
      <ul class="v2-list">
        <li class="pv-in" style="--i:2"><a href="${SITE}index.html#contact"><b>Réserver une table</b><small>Mardi – samedi, dès 18h</small><span class="arrow" aria-hidden="true">→</span></a></li>
        <li class="pv-in" style="--i:3"><a href="${SITE}index.html#menus"><b>La carte</b><small>16 cocktails · à partager</small><span class="arrow" aria-hidden="true">→</span></a></li>
        <li class="pv-in" style="--i:4"><a href="${SITE}index.html#ateliers"><b>Ateliers cocktails</b><small>EVJF · 4 à 10 personnes</small><span class="arrow" aria-hidden="true">→</span></a></li>
      </ul>
    </div>
    <figure class="v2-media pv-in" style="--i:1">${VIDEO}<figcaption>82 rue de Charenton · Paris 12e</figcaption></figure>
  </section>`,
  // 3 · Ce soir
  ()=>{const s=openingStatus();return `<section class="v3" aria-label="Accueil">${VIDEO}
    <div><h1 class="pv-in" style="--i:0">${H1}</h1><p class="v3-sig pv-in" style="--i:1">Le geste juste, le goût de l’exception.</p></div>
    <aside class="v3-card pv-in" style="--i:2" data-open="${s.open}" aria-label="Infos pratiques">
      <p class="v3-status"><span class="v3-dot" aria-hidden="true"></span>${s.text}</p>
      <p class="v3-hours">${s.hours}</p>
      <div class="v3-where"><span>82 rue de Charenton · Gare de Lyon</span><a href="https://goo.gl/maps/UjKyPUVbv9vbNfPr7" target="_blank" rel="noopener noreferrer">Itinéraire →</a></div>
      <div class="v3-actions"><a class="pv-btn pv-btn--primary" href="${SITE}index.html#contact">Réserver une table</a><a class="pv-btn pv-btn--ghost" href="tel:+33184061890" aria-label="Appeler le Calbar au 01 84 06 18 90">Appeler</a></div>
      <p class="v3-more"><a href="${SITE}index.html#menus">La carte</a><a href="${SITE}index.html#ateliers">Ateliers cocktails</a></p>
    </aside>
  </section>`}
];

// Picker wiring (verbatim from PICKER.md)
const stage=document.getElementById('stage');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');
let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();});}
function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i);}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
replay?.addEventListener('click',()=>mount(current));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',(e)=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current);});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body></html>
