# Publishes the contents of site/ to the root of the `staging` branch on every push to main touching site/
# (replaced each time, like gh-pages). Hostinger deploys `staging` to https://test.lecalbarcocktail.com.
# Same checks as "Publish to Hostinger"; staging is also kept out of search engines.
name: Publish to staging

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/staging.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site/ to the staging branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          test -f site/index.html && test -f site/api/request.php
          rm -rf "$RUNNER_TEMP/stage" && cp -r site "$RUNNER_TEMP/stage"
          find "$RUNNER_TEMP/stage" -name .DS_Store -delete
          rm -f "$RUNNER_TEMP/stage/calbar-form-config.php"
          cd "$RUNNER_TEMP/stage"
          # Staging only: no indexing
          printf '\n# Staging: keep out of search engines\n<IfModule mod_headers.c>\nHeader always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> .htaccess
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          git init -q -b staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Stage ${GITHUB_SHA::7} from main"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" staging
